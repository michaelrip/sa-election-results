name: Update three-metro election results
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metro-results-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate IEC-derived metro results
        run: python scripts/fetch_results.py
      - name: Publish validated results and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json feed-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified-source three-metro results"
            git push
          fi
