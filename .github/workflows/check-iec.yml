name: Check official IEC election feed
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official IEC API without publishing unverified numbers
        env:
          IEC_EVENT_ID: ${{ vars.IEC_EVENT_ID }}
          IEC_PROVINCE_ID: ${{ vars.IEC_PROVINCE_ID }}
          IEC_CAPE_TOWN_ID: ${{ vars.IEC_CAPE_TOWN_ID }}
          IEC_TSHWANE_ID: ${{ vars.IEC_TSHWANE_ID }}
          IEC_JOHANNESBURG_ID: ${{ vars.IEC_JOHANNESBURG_ID }}
        run: python scripts/check_iec.py
      - name: Save feed check status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record hourly IEC feed connectivity check"
            git push
          fi
