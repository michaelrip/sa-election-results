name: Update four-area election results
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_results.py'
      - 'tests/test_fetch_results.py'
      - 'scripts/update_ward_details.py'
      - 'tests/test_ward_top_three.py'
      - 'tests/test_ward_areas.py'
      - 'scripts/update_ward_areas.py'
      - '.github/workflows/check-iec.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metro-results-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test importer against representative public page markup
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate IEC-derived metro results
        run: python scripts/fetch_results.py
      - name: Import validated top-three ward-ballot results from individual wards
        run: python scripts/update_ward_details.py
      - name: Refresh area labels for all 2026 wards
        run: python scripts/update_ward_areas.py
      - name: Publish validated results and status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json feed-status.json ward-areas.json ward-area-status.json ward-details.json ward-detail-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified-source four-area results"
            # Keep remote changes; replay only the generated report commit.
            # Retry in case another update lands during the push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                echo "Rebase conflict: refusing to overwrite remote results."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another commit; retrying ($attempt/5)."
              sleep 2
            done
            echo "Could not publish after 5 attempts."
            exit 1
          fi

      - name: Confirm all metro feeds passed validation
        run: |
          python - <<'PY'
          import json, sys
          status = json.load(open("feed-status.json", encoding="utf-8"))
          for metro, check in status["checks"].items():
              print(metro, check)
          if status["status"] != "ok":
              sys.exit("One or more source feeds failed. Check feed-status.json.")
          PY

      - name: Confirm ward area labels are available
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("ward-areas.json", encoding="utf-8"))
          expected = {"Cape Town": 118, "Tshwane": 107, "Johannesburg": 135, "Hermanus": 15}
          for metro, n in expected.items():
              count = len(data.get("metros", {}).get(metro, {}))
              print(f"{metro}: {count}/{n} area labels")
              if count != n:
                  sys.exit("Missing 2026 ward area labels; see ward-area-status.json")
          PY
