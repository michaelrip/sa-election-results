name: Update election news headlines
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - 'scripts/publish_generated_data.sh'
      - 'tests/test_news.py'
      - '.github/workflows/update-news.yml'
  workflow_dispatch:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
permissions:
  contents: write
concurrency:
  group: municipal-election-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test headline importer
        run: python -m unittest discover -s tests -p 'test_news.py' -v
      - name: Discover recent election headlines
        run: python scripts/update_news.py
      - name: Safely publish the newest attributed headlines
        run: |
          bash scripts/publish_generated_data.sh news-status.json "Update attributed South African election headlines" \
            news.json news-status.json
